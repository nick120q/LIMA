<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    
    <!-- Listas não ordenadas -->
    <ul>
        <li>Salgado</li>
        <li>Tenébrio</li>
        <li>Tanajura</li>
    </ul>

    <!-- Listas ordenadas -->
    <ol>
        <li>Ligar o pc</li>
        <li>Abrir o navegador</li>
        <li>Pesquisar youtube.com</li>
    </ol>

    <!-- Listas alinhadas -->
    <ul>
        <li>Frutas
            <ul>
                <li>Maçã</li>
                <li>Banana</li>
                <li>Laranja</li>
            </ul>
        </li>
        <li>Vegetais
            <ul>
                <li>Cará</li>
                <li>Alface</li>
                <li>Tomate</li>
            </ul>
        </li>
    </ul>
</body>
</html>
