<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
</head>
<body>
    <form>

    <label for="nome">Nome:</label>
    <input type="text" name="nome" placeholder="Digite seu nome" required>  
    
    <label for="sobrenome">Sobrenome:</label>
    <input type="text" name="sobrenome" placeholder="Digite seu sobrenome" required>

    <label for="email">E-mail:</label>
    <input type="email" name="email" placeholder="Digite seu e-mail" required>

    <label for="senha">Senha:</label>
    <input type="password" name="senha" placeholder="Digite sua senha" required>

    <label for="endereco">Endereço:</label>
    <input type="text" name="endereco" placeholder="Digite seu endereço" required>

    <label for="numCasa">Número da casa:</label>
    <input type="number" name="numCasa" placeholder="Digite o número da sua casa">

    <p>Você quer receber atualizações?</p>
    <label><input type="radio" name="receberAtualizações">Sim</label>
    <label><input type="radio" name="receberAtualizações">Não</label>

    <p>Termos</p>
    <label><input type="checkbox" name="termos">Termos de uso</label>
    <label><input type="checkbox" name="termos">Termos de direitos</label>

    <button type="submit">Enviar</button>

    </form>  
</body>
</html>
