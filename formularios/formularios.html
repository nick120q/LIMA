<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    
    <!-- Estrutura do formulário -->
     <form>

        <label for="nome">Nome:</label> <!-- Associação de texto com o campo de entrada -->
        <input type="text" name="nome" placeholder="Digite seu nome" required> <!-- Campo de entrada de texto -->

        <label for="email">Email:</label> 
        <input type="email" name="email" placeholder="Digite seu email" required>

        <label for="numero">Número:</label>
        <input type="number" name="numero" placeholder="Digite um número" required>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" placeholder="Digite sua senha" required>

        <label for="data">Data:</label>
        <input type="date" name="data" required>

        <p>Escolha sua cor preferida</p>
        <label><input type="radio" name="cor">Rosa</label>
        <label><input type="radio" name="cor">Verde</label>
        <label><input type="radio" name="cor">Roxo</label>

        <p>Escolha suas frutas favoritas</p>
        <label><input type="checkbox" name="frutas">Maçã</label>
        <label><input type="checkbox" name="frutas">Uva</label>
        <label><input type="checkbox" name="frutas">Banana</label>

        <button type="submit">Enviar</button>
        <!-- required -->
     </form>

</body>
</html>
